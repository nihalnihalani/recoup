name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default; no job here needs to write to the repo or open PRs.
permissions:
  contents: read

# M08 (QA-12): pull requests are grouped by ref, so a newer push to the same PR
# cancels the superseded run. Pushes to main are grouped by commit SHA and
# never cancel each other. Before this, a docs-only push cancelled the
# in-flight run for the code commit before it, so that commit was only ever
# verified as part of a later tree. (GitHub also cancels a PENDING run when
# a newer one queues in the same group, so cancel-in-progress: false alone
# would not have been enough.)
# A paths filter that skips docs-only pushes was rejected: the suite reads
# docs/rules/** (fixture JSON, manifest.json, README.md via
# convex/testing/ruleFixtures.loader.test.ts), and a "docs-only" commit
# (72fe1a2, R01.json) did turn main red on 2026-09-23.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node version comes from .nvmrc (currently 22.x, see engines.node in
      # package.json) so there is exactly one place to bump it.
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Full install, WITH scripts (default). This is the only supported
      # install mode for this repo -- see docs/ops/INSTALL.md for why
      # `--omit=dev` / `--ignore-scripts` are not supported: patch-package
      # (which repairs a real production bug in @agentmail/convex, see
      # patches/@agentmail+convex+0.1.0.patch) is a devDependency and runs
      # from postinstall, and build tooling (tsc, vite) also lives in
      # devDependencies.
      - name: npm ci
        run: npm ci

      # Belt-and-suspenders on top of postinstall: assert the patch is
      # actually present in node_modules, not just that patch-package ran.
      # docs/team/VERIFICATION.md records this patch being silently unapplied
      # once already.
      - name: verify:patch
        run: npm run verify:patch

      - name: typecheck
        run: npm run typecheck

      # M08 (QA-9/D144): the Playwright specs and fixtures were never
      # type-checked in CI.
      - name: typecheck:e2e
        run: npm run typecheck:e2e

      # M19 (contract §2.7, D146 R4-4): rule-pack consistency. Checks
      # manifest <-> activation.ts <-> DECISIONS, that reviewed pack files are
      # unchanged, and that reviewed manifest hashes and ACTIVATIONS are
      # append-only relative to the push's previous tip (or the PR base). The
      # script fetches that commit itself if this shallow checkout lacks it.
      # verify-rule-sources.mjs is on-demand only and must never run in CI.
      - name: check-rule-packs
        run: node scripts/check-rule-packs.mjs
        env:
          RULE_PACKS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      # M08 (D144): zero warnings. The one pre-existing warning
      # (convex/lib/passage.ts, T16) is gone, so any new warning fails CI.
      - name: lint
        run: npm run lint -- --max-warnings=0

      # Enforced test gate: runs vitest itself with --reporter=json and fails
      # on any failing test, fewer than the floor in
      # scripts/check-test-count.mjs (DEFAULT_MIN_COUNT), or any file that
      # collected 0 tests. Replaces the old `vitest run --passWithNoTests`,
      # which would exit 0 on an empty/misconfigured suite.
      - name: test (with minimum-count gate)
        run: npm run test:ci

      - name: build
        run: npm run build

      - name: dist size summary
        run: |
          echo "### dist/ size" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist -maxdepth 2 -type f -exec du -h {} \; | sort -rh >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # See scripts/check-codegen.mjs for the full explanation: `npx convex
      # codegen` (dry-run or not) always requires a reachable, already-linked
      # deployment and explicitly refuses a preview CONVEX_DEPLOY_KEY, so
      # this can only run when a dedicated codegen deployment's admin key is
      # provided as repo secrets. Without them, the script prints a skip
      # notice and exits 0 -- it is informational here, not a required gate,
      # until such a deployment is provisioned (see docs/ops/INSTALL.md).
      - name: codegen:check
        run: npm run codegen:check
        env:
          CONVEX_URL: ${{ secrets.CODEGEN_CHECK_CONVEX_URL }}
          CONVEX_ADMIN_KEY: ${{ secrets.CODEGEN_CHECK_CONVEX_ADMIN_KEY }}

  # M08 (D138 recurrence guard): the whole suite with the process clock moved
  # +400 days (convex/testing/clockShift.setup.ts), through the same count
  # gate. A test that passes only on today's date fails here the day it
  # lands, not a year later. Measured locally at about 1x the normal suite
  # time (48 s vs 50 s), so it runs on every push, in parallel with checks.
  clockshift:
    name: clockshift (+400 days)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name: test:clockshift
        run: npm run test:clockshift

  # M16 (D189): the whole suite in a German locale. Money and dates are formatted in the viewer's locale, so a test
  # that asserts an en-US literal ("$50.00") passes on an en-US machine and fails everywhere else, a locale
  # time-bomb like D138's clock one (two such files were found and pinned with src/test/locale.ts). Node's ICU takes
  # the default locale from LC_ALL even where the OS has no de_DE installed; the first step proves it did.
  localeshift:
    name: localeshift (de_DE locale)
    runs-on: ubuntu-latest
    env:
      LC_ALL: de_DE.UTF-8
      LANG: de_DE.UTF-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # The runner image ships without the de_DE locale, so until it is generated bash warns "setlocale: LC_ALL:
      # cannot change locale" in every step (this one included). Node's ICU reads LANG/LC_ALL itself and does not
      # need it, but generating it makes the libc locale real too and silences the warning in the later steps.
      - name: generate the de_DE.UTF-8 locale
        run: sudo locale-gen de_DE.UTF-8

      - name: npm ci
        run: npm ci

      # Fails the job rather than letting it pass silently in en-US: both the libc locale and Node's default Intl
      # locale must be German.
      - name: assert the German locale is in effect
        run: |
          locale -a | grep -qi '^de_DE\.utf-\?8$' || { echo "de_DE.UTF-8 is not installed"; exit 1; }
          node -e 'const l = new Intl.NumberFormat().resolvedOptions().locale; console.log("default locale", l, new Intl.NumberFormat(undefined, { style: "currency", currency: "USD" }).format(1234.5)); if (!l.startsWith("de")) { console.error("LC_ALL was not applied"); process.exit(1); }'

      - name: test:ci under de_DE
        run: npm run test:ci

  # D227 / security baseline §7 P5: a precondition for ever enabling live document extraction (D145, D203). Fails on
  # any HIGH or CRITICAL advisory in a PRODUCTION dependency (what Convex bundles and runs: pdfjs-dist and the rest of
  # `dependencies`, transitively). `npm audit` reads only package.json and package-lock.json and asks the npm
  # registry's advisory endpoint (the GitHub Advisory Database), so no install is needed. devDependencies are out of
  # scope here (they never reach a deployment). A finding is fixed by upgrading the dependency, never by suppressing
  # it. For a pdf.js advisory the RUNBOOK's 7-day rule applies: patch within 7 days or switch live extraction off.
  # If the registry cannot be reached, npm audit exits non-zero and the job fails: an audit that did not run never
  # passes.
  advisories:
    name: advisories (production dependencies, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: npm audit --omit=dev --audit-level=high
        run: npm audit --omit=dev --audit-level=high

  # P10 browser acceptance suite (T20). Runs only when the E2E_CONVEX_URL and
  # E2E_DEPLOY_KEY repo secrets exist. They must point at a DEDICATED E2E
  # deployment: never the shared dev deployment adorable-lion-138 and never
  # production cool-oyster-399 (docs/ops/RELEASE.md §4). e2e/fixtures.ts
  # refuses both, and refuses a URL/key pair naming two different
  # deployments. That deployment needs E2E_SEED_ENABLED=true and this
  # commit's functions deployed. This job does NOT deploy functions.
  # Secret values are never echoed.
  # KC1 (D237, M25): without the E2E secrets the browser suite cannot run, and CI must SAY so instead of reporting a
  # green `e2e`. This job only checks whether the secrets exist (never their values) and publishes a warning annotation
  # plus a run-summary line; the `e2e` job below then shows as SKIPPED (not success) through its job-level `if:`.
  # (A job-level `if:` cannot read `secrets`, hence the separate job.) `convex/testing/ciWorkflow.static.test.ts`
  # keeps this shape: no per-step secret checks inside `e2e`, and the skip stays visible.
  e2e-secrets:
    name: "e2e: secrets configured?"
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: check for e2e secrets
        id: check
        run: |
          if [ -n "$HAS_URL" ] && [ -n "$HAS_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "### e2e: secrets configured, the Playwright suite runs in the e2e job" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=e2e skipped: secrets not configured::E2E_CONVEX_URL / E2E_DEPLOY_KEY are not configured, so the e2e job is SKIPPED and the Playwright suite did NOT run (docs/ops/RELEASE.md §4). Browser evidence is QA's local run against the dev deployment."
            echo "### e2e: SKIPPED (secrets not configured). Playwright did not run; E2E_CONVEX_URL / E2E_DEPLOY_KEY are missing" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          HAS_URL: ${{ secrets.E2E_CONVEX_URL }}
          HAS_KEY: ${{ secrets.E2E_DEPLOY_KEY }}

  e2e:
    name: e2e
    needs: [checks, e2e-secrets]
    # Skipped (shown grey, conclusion "skipped") when the secrets are missing: never a silent success (KC1).
    if: needs.e2e-secrets.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name: install Playwright browsers
        run: npx playwright install --with-deps chromium

      # e2e/fixtures.ts uses E2E_DEPLOY_KEY as the Convex CLI's
      # CONVEX_DEPLOY_KEY for seeding. playwright.config.ts gives the dev
      # server VITE_CONVEX_URL = E2E_CONVEX_URL unless E2E_BASE_URL points at
      # an already running app. E2E_ALLOW_UNKNOWN_DEPLOYMENT acknowledges
      # that the CI deployment is not the local default.
      - name: run Playwright suite
        run: npx playwright test
        env:
          E2E_CONVEX_URL: ${{ secrets.E2E_CONVEX_URL }}
          E2E_DEPLOY_KEY: ${{ secrets.E2E_DEPLOY_KEY }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ALLOW_UNKNOWN_DEPLOYMENT: "true"

      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
